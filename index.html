<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二游舆情监控看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
        }

        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
            scroll-behavior: smooth;
        }

        .tab-btn {
            flex-shrink: 0;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: rgba(30, 41, 59, 0.6);
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #334155;
        }

        .tab-btn:hover {
            background: rgba(30, 144, 255, 0.15);
            border-color: #0ea5e9;
            color: #60a5fa;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #0ea5e9, #7c3aed);
            color: #ffffff;
            border-color: #0ea5e9;
        }

        .content-area {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            min-height: 600px;
            overflow: hidden;
        }

        .content-section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        iframe {
            width: 100%;
            height: 800px;
            border: none;
            border-radius: 8px;
            background: #0f172a;
        }

        .placeholder {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .placeholder h2 {
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .card:hover {
            background: rgba(30, 144, 255, 0.1);
            border-color: #0ea5e9;
            transform: translateX(4px);
        }

        .card-title {
            font-weight: 600;
            color: #60a5fa;
            margin-bottom: 4px;
        }

        .card-meta {
            font-size: 12px;
            color: #94a3b8;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
            padding-top: 20px;
            border-top: 1px solid #334155;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 28px;
            }

            .tabs-container {
                gap: 6px;
            }

            .tab-btn {
                padding: 10px 14px;
                font-size: 12px;
            }

            iframe {
                height: 600px;
            }

            .content-area {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 二游舆情监控看板</h1>
            <p class="subtitle">NGA / B站 / 贴吧 / 速报 - 每日实时监测</p>
        </header>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab(0, this)">📊 NGA吃瓜播报</button>
            <button class="tab-btn" onclick="switchTab(1, this)">🔴 B站直播日报</button>
            <button class="tab-btn" onclick="switchTab(2, this)">💬 B站游戏舆情</button>
            <button class="tab-btn" onclick="switchTab(3, this)">🎮 二次元重点游戏版更</button>
            <button class="tab-btn" onclick="switchTab(4, this)">📄 贴吧舆情日报</button>
        </div>

        <div class="content-area">
            <!-- NGA 吃瓜播报 -->
            <div class="content-section active" id="section-0">
                <iframe src="docs/reports/latest/nga_report.html"></iframe>
            </div>

            <!-- B站直播日报 -->
            <div class="content-section" id="section-1">
                <iframe src="docs/reports/latest/bilibili_live_report.html"></iframe>
            </div>

            <!-- B站游戏舆情 -->
            <div class="content-section" id="section-2">
                <iframe src="docs/reports/latest/bilibili_game_report.html"></iframe>
            </div>

            <!-- 二次元游戏速报 -->
            <div class="content-section" id="section-3">
                <iframe src="docs/reports/latest/game_speed_report.html"></iframe>
            </div>

            <!-- 贴吧舆情日报 -->
            <div class="content-section" id="section-4">
                <iframe src="docs/reports/latest/tieba_report.html"></iframe>
            </div>
        </div>

        <div class="footer">
            <p>💾 所有报告每日自动生成并更新 | 📈 最后同步：<span id="update-time">加载中...</span></p>
        </div>
    </div>

    <script>
        function switchTab(index, element) {
            // 隐藏所有内容区域
            const sections = document.querySelectorAll('.content-section');
            sections.forEach(section => section.classList.remove('active'));

            // 移除所有按钮的 active 类
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // 激活当前选项卡
            document.getElementById(`section-${index}`).classList.add('active');
            element.classList.add('active');

            // 平滑滚动到选项卡
            element.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
        }

        // 初始化更新时间
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('update-time').textContent = timeStr;
        }

        updateTime();
        setInterval(updateTime, 60000); // 每分钟更新一次
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二游舆情监控看板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 14px;
            -webkit-text-size-adjust: 100%;
        }

        /* ========== 顶部标题栏 ========== */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            border-bottom: 1px solid #1e293b;
            flex-shrink: 0;
        }
        .topbar-title {
            font-size: 15px;
            font-weight: 600;
            color: #f1f5f9;
            letter-spacing: 0.3px;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-right label { font-size: 12px; color: #64748b; }
        #date-select {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            border-radius: 5px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        #update-time { font-size: 11px; color: #475569; }

        /* ========== 主体布局 ========== */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ========== 左侧面板 ========== */
        .left-panel {
            width: 320px;
            flex-shrink: 0;
            border-right: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            background: #0f172a;
        }
        .left-header {
            padding: 12px 16px 10px;
            border-bottom: 1px solid #1e293b;
            flex-shrink: 0;
        }
        .left-header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .left-header-top .lh-title {
            font-size: 13px;
            font-weight: 600;
            color: #f1f5f9;
        }
        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            background: rgba(34,197,94,0.12);
            color: #4ade80;
            font-size: 11px;
            border-radius: 4px;
            border: 1px solid rgba(34,197,94,0.25);
        }
        .badge-live::before {
            content: '';
            width: 5px; height: 5px;
            border-radius: 50%;
            background: #4ade80;
            display: block;
        }
        .left-header .lh-meta { font-size: 11px; color: #475569; }

        /* 左侧子 tab */
        .left-subtabs {
            display: flex;
            gap: 4px;
            padding: 8px 16px;
            border-bottom: 1px solid #1e293b;
            flex-shrink: 0;
        }
        .stab {
            flex: 1;
            padding: 4px 0;
            border: 1px solid #334155;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            background: transparent;
            color: #64748b;
            text-align: center;
        }
        .stab.on {
            background: #1e293b;
            color: #94a3b8;
            border-color: #475569;
        }

        /* 左侧内容区 */
        .left-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px 16px;
        }
        .left-body::-webkit-scrollbar { width: 3px; }
        .left-body::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

        .section { display: none; }
        .section.on { display: block; }

        /* 重点动态 */
        .dyn-item {
            padding: 9px 0;
            border-bottom: 1px solid #1e293b;
        }
        .dyn-item:last-child { border-bottom: none; }
        .dyn-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 3px;
        }
        .dyn-name {
            font-size: 13px;
            font-weight: 500;
            color: #e2e8f0;
            line-height: 1.4;
            flex: 1;
        }
        .pri {
            flex-shrink: 0;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 10px;
            margin-top: 2px;
        }
        .pri-h { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
        .pri-m { background: rgba(234,179,8,0.12); color: #fbbf24; border: 1px solid rgba(234,179,8,0.2); }
        .game-tag {
            display: inline-block;
            padding: 0 5px;
            background: #1e293b;
            color: #64748b;
            font-size: 10px;
            border-radius: 3px;
            margin-right: 4px;
            margin-bottom: 3px;
        }
        .dyn-desc {
            font-size: 12px;
            color: #64748b;
            line-height: 1.5;
        }

        /* 卡池时间 */
        .banner-item {
            padding: 9px 0;
            border-bottom: 1px solid #1e293b;
        }
        .banner-item:last-child { border-bottom: none; }
        .banner-date { font-size: 11px; color: #475569; margin-bottom: 2px; }
        .banner-title { font-size: 13px; font-weight: 500; color: #e2e8f0; margin-bottom: 2px; }
        .banner-desc { font-size: 12px; color: #64748b; }

        /* 兑换码 */
        .code-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 9px 0;
            border-bottom: 1px solid #1e293b;
        }
        .code-row:last-child { border-bottom: none; }
        .code-gname { font-size: 11px; color: #475569; margin-bottom: 2px; }
        .code-val {
            font-family: "SF Mono", "Fira Code", "Consolas", monospace;
            font-size: 13px;
            color: #7dd3fc;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .code-reward { font-size: 11px; color: #64748b; margin-top: 2px; }
        .copy-btn {
            flex-shrink: 0;
            padding: 4px 10px;
            border: 1px solid #334155;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            background: transparent;
            color: #64748b;
            white-space: nowrap;
        }
        .copy-btn:hover { border-color: #475569; color: #94a3b8; }

        /* 左侧加载/空态 */
        .left-loading {
            padding: 32px 0;
            text-align: center;
            color: #334155;
            font-size: 13px;
        }

        /* ========== 右侧面板 ========== */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .right-header {
            padding: 10px 16px 0;
            border-bottom: 1px solid #1e293b;
            flex-shrink: 0;
        }
        .right-header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .rh-title { font-size: 12px; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; }
        .rh-meta { font-size: 11px; color: #475569; }

        /* 右侧 tab */
        .right-tabs {
            display: flex;
            gap: 0;
            overflow-x: auto;
        }
        .right-tabs::-webkit-scrollbar { height: 2px; }
        .right-tabs::-webkit-scrollbar-thumb { background: #334155; }
        .rtab {
            flex-shrink: 0;
            padding: 8px 18px;
            border: none;
            border-bottom: 2px solid transparent;
            background: transparent;
            color: #64748b;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            margin-bottom: -1px;
        }
        .rtab:hover { color: #94a3b8; }
        .rtab.on {
            color: #7dd3fc;
            border-bottom-color: #7dd3fc;
            font-weight: 500;
        }

        /* 右侧内容 */
        .right-body { flex: 1; overflow: hidden; position: relative; }
        .rpane { position: absolute; inset: 0; display: none; }
        .rpane.on { display: block; }
        .rpane iframe {
            width: 100%; height: 100%;
            border: none;
            background: #0f172a;
        }
        .rpane-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #334155;
            font-size: 13px;
        }
        .rtab-meta-bar {
            padding: 4px 16px 8px;
            font-size: 11px;
            color: #475569;
        }

        /* 移动端切换按钮（仅窄屏可见） */
        .view-switch {
            display: none;
            gap: 4px;
            margin-right: 8px;
        }
        .vs-btn {
            padding: 4px 10px;
            border: 1px solid #334155;
            border-radius: 5px;
            background: transparent;
            color: #64748b;
            font-size: 12px;
            cursor: pointer;
        }
        .vs-btn.on {
            background: #1e293b;
            color: #cbd5e1;
            border-color: #475569;
        }

        /* ========== 响应式：平板（≤1100px）：缩窄左侧 ========== */
        @media (max-width: 1100px) {
            .left-panel { width: 280px; }
        }

        /* ========== 响应式：手机/小屏（≤900px）：上下堆叠 + 视图切换 ========== */
        @media (max-width: 900px) {
            body { font-size: 13px; }
            .topbar { padding: 8px 12px; flex-wrap: wrap; gap: 8px; }
            .topbar-title { font-size: 14px; }
            .topbar-right { gap: 8px; }
            .topbar-right label { display: none; }
            #update-time { display: none; }

            .view-switch { display: flex; }

            .main { flex-direction: column; }
            .left-panel,
            .right-panel {
                width: 100%;
                flex: none;
                border-right: none;
                display: none;
            }
            .left-panel { border-bottom: 1px solid #1e293b; }
            .left-panel.active,
            .right-panel.active { display: flex; flex: 1; min-height: 0; }

            .left-header { padding: 10px 12px 8px; }
            .left-subtabs { padding: 6px 12px; gap: 6px; }
            .stab { padding: 5px 0; font-size: 12px; }
            .left-body { padding: 10px 12px 14px; }

            .dyn-name { font-size: 14px; }
            .dyn-desc { font-size: 13px; }
            .banner-title { font-size: 14px; }
            .banner-desc { font-size: 13px; }
            .code-val { font-size: 14px; }
            .code-reward { font-size: 12px; }

            .right-header { padding: 8px 12px 0; }
            .rh-title { display: none; }
            .right-tabs { gap: 0; }
            .rtab { padding: 8px 12px; font-size: 13px; }
            .rtab-meta-bar { padding: 4px 12px 6px; }
        }
    </style>
</head>
<body>

    <!-- 顶部标题栏 -->
    <div class="topbar">
        <span class="topbar-title">二游舆情监控看板</span>
        <div class="topbar-right">
            <div class="view-switch" id="view-switch">
                <button class="vs-btn on" onclick="vs('left',this)">情报</button>
                <button class="vs-btn" onclick="vs('right',this)">舆情</button>
            </div>
            <label>舆情数据日期</label>
            <select id="date-select" onchange="onDateChange()">
                <option value="">加载中...</option>
            </select>
            <span id="update-time"></span>
        </div>
    </div>

    <!-- 主体 -->
    <div class="main">

        <!-- 左侧：今日版本情报 -->
        <div class="left-panel active" id="left-panel">
            <div class="left-header">
                <div class="left-header-top">
                    <span class="lh-title">今日版本情报</span>
                    <span class="badge-live">实时</span>
                </div>
                <div class="lh-meta" id="left-meta">加载中...</div>
            </div>
            <div class="left-subtabs">
                <button class="stab on" onclick="sw(0,this)">重点动态</button>
                <button class="stab" onclick="sw(1,this)">卡池时间</button>
                <button class="stab" onclick="sw(2,this)">直播</button>
                <button class="stab" onclick="sw(3,this)">兑换码</button>
            </div>
            <div class="left-body" id="left-body">
                <div class="left-loading">加载中...</div>
            </div>
        </div>

        <!-- 右侧：社区热度报告 -->
        <div class="right-panel" id="right-panel">
            <div class="right-header">
                <div class="right-header-top">
                    <span class="rh-title">社区热度报告</span>
                </div>
                <div class="right-tabs" id="right-tabs">
                    <button class="rtab on" onclick="rt(0,this)">NGA 吃瓜</button>
                    <button class="rtab" onclick="rt(1,this)">B 站游戏</button>
                    <button class="rtab" onclick="rt(2,this)">B 站直播</button>
                    <button class="rtab" onclick="rt(3,this)">贴吧</button>
                </div>
                <div class="rtab-meta-bar" id="rtab-meta">昨日数据</div>
            </div>
            <div class="right-body">
                <div class="rpane on" id="rpane-0"><iframe id="rframe-0" src="about:blank"></iframe></div>
                <div class="rpane" id="rpane-1"><iframe id="rframe-1" src="about:blank"></iframe></div>
                <div class="rpane" id="rpane-2"><iframe id="rframe-2" src="about:blank"></iframe></div>
                <div class="rpane" id="rpane-3"><iframe id="rframe-3" src="about:blank"></iframe></div>
            </div>
        </div>

    </div>

    <script>
        // ========== 配置 ==========
        // 右侧 tab 对应的 source id 和目录
        const RIGHT_SOURCES = [
            { id: 'nga',           dir: 'nga',           label: 'NGA 吃瓜' },
            { id: 'bilibili_game', dir: 'bilibili_game', label: 'B 站游戏' },
            { id: 'bilibili_live', dir: 'bilibili_live', label: 'B 站直播' },
            { id: 'tieba',         dir: 'tieba',         label: '贴吧' },
        ];

        // 已知舆情数据日期（从新到旧），推送脚本自动追加
        const SENTIMENT_DATES = [
            '2026-06-05',
            '2026-06-04',
            '2026-06-03',
            '2026-06-02',
        ];

        // 今日速报 JSON 路径（总是最新一期）
        const SPEED_DATE = '2026-06-06';

        // ========== 右侧 tab 切换 ==========
        const rtabMetas = [];

        function rt(i, el) {
            document.querySelectorAll('.rtab').forEach(t => t.classList.remove('on'));
            document.querySelectorAll('.rpane').forEach(p => p.classList.remove('on'));
            el.classList.add('on');
            document.getElementById('rpane-' + i).classList.add('on');
            document.getElementById('rtab-meta').textContent = rtabMetas[i] || '';
        }

        // ========== 左侧子 tab 切换 ==========
        function sw(i, el) {
            document.querySelectorAll('.stab').forEach(t => t.classList.remove('on'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('on'));
            el.classList.add('on');
            const s = document.getElementById('ls-' + i);
            if (s) s.classList.add('on');
        }

        // ========== 右侧：加载舆情报告 ==========
        function loadSentiment(date) {
            const sel = document.getElementById('date-select');

            // 加载 summary JSON 获取各来源 metric
            fetch('summary/' + date + '.json?t=' + Date.now())
                .then(r => r.json())
                .then(data => {
                    const taskMap = {};
                    (data.tasks || []).forEach(t => { taskMap[t.id] = t; });

                    RIGHT_SOURCES.forEach((src, i) => {
                        const task = taskMap[src.id];
                        const iframe = document.getElementById('rframe-' + i);
                        if (task) {
                            iframe.src = src.dir + '/' + date + '/report.html';
                            // iframe 加载完后注入 viewport 让内部响应式生效
                            iframe.onload = () => injectViewport(iframe);
                            const metric = task.metric_value + ' ' + task.metric_label;
                            rtabMetas[i] = '昨日数据 · ' + date + ' · ' + metric;
                        } else {
                            iframe.src = 'about:blank';
                            rtabMetas[i] = '暂无数据 · ' + date;
                        }
                    });

                    // 更新当前激活 tab 的 meta
                    const activeIdx = [...document.querySelectorAll('.rtab')].findIndex(t => t.classList.contains('on'));
                    document.getElementById('rtab-meta').textContent = rtabMetas[activeIdx] || '';

                    const upd = data.updated_at ? new Date(data.updated_at).toLocaleString('zh-CN') : '';
                    document.getElementById('update-time').textContent = upd ? '更新于 ' + upd : '';
                })
                .catch(() => {
                    document.getElementById('update-time').textContent = '加载失败';
                });
        }

        function onDateChange() {
            const date = document.getElementById('date-select').value;
            if (date) loadSentiment(date);
        }

        // ========== 左侧：渲染速报 JSON ==========
        function loadSpeedReport(date) {
            document.getElementById('left-meta').textContent = '加载中...';
            fetch('game_speed/' + date + '/data.json?t=' + Date.now())
                .then(r => r.json())
                .then(data => {
                    const meta = data.meta || {};
                    document.getElementById('left-meta').textContent =
                        date + ' · ' + (meta.gameCount || '?') + ' 款游戏 · 自动更新';
                    renderLeft(data);
                })
                .catch(() => {
                    document.getElementById('left-meta').textContent = '暂无数据';
                    document.getElementById('left-body').innerHTML =
                        '<div class="left-loading">今日速报尚未生成</div>';
                });
        }

        function renderLeft(data) {
            const highlights = data.highlights || [];
            const banners    = data.banners    || [];
            const codes      = (data.codes || []).filter(c => c.status !== 'EXPIRED');
            const calendar   = data.calendar   || [];
            const broadcasts = calendar.filter(c => c.type === 'broadcast');

            // gameId → 中文名映射，用于直播tab的友好显示
            const games = data.games || [];
            const gameNameMap = {};
            (Array.isArray(games) ? games : Object.values(games)).forEach(g => {
                if (g && g.gameId) gameNameMap[g.gameId] = g.name || g.gameId;
            });

            // --- 重点动态 ---
            let h0 = '';
            if (highlights.length === 0) {
                h0 = '<div class="left-loading">暂无重点动态</div>';
            } else {
                highlights.forEach(item => {
                    const priCls = item.priority === 'HIGH' ? 'pri-h' : 'pri-m';
                    const priTxt = item.priority === 'HIGH' ? '重要' : '关注';
                    const games  = (item.gameList || []).map(g => `<span class="game-tag">${g}</span>`).join('');
                    h0 += `<div class="dyn-item">
                        <div class="dyn-top">
                            <span class="dyn-name">${item.title}</span>
                            <span class="pri ${priCls}">${priTxt}</span>
                        </div>
                        <div>${games}</div>
                        <div class="dyn-desc">${item.description || ''}</div>
                    </div>`;
                });
            }

            // --- 卡池时间 ---
            let h1 = '';
            if (banners.length === 0) {
                h1 = '<div class="left-loading">暂无卡池信息</div>';
            } else {
                banners.forEach(b => {
                    const d = b.date ? b.date.slice(5) : '';
                    h1 += `<div class="banner-item">
                        <div class="banner-date">${d}</div>
                        <div class="banner-title">${b.title}</div>
                        <div class="banner-desc">${b.desc || ''}</div>
                    </div>`;
                });
            }

            // --- 直播 ---
            let h2 = '';
            if (broadcasts.length === 0) {
                h2 = '<div class="left-loading">暂无直播预告</div>';
            } else {
                // 按日期排序
                broadcasts.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
                broadcasts.forEach(b => {
                    const d = b.date ? b.date.slice(5) : '';
                    const game = gameNameMap[b.gameId] || b.gameId || '';
                    const importantBadge = b.important
                        ? '<span class="pri pri-h" style="margin-left:6px;">重点</span>'
                        : '';
                    h2 += `<div class="banner-item">
                        <div class="banner-date">${d}${importantBadge}</div>
                        <div class="banner-title">${b.event || ''}</div>
                        <div class="banner-desc">${game}</div>
                    </div>`;
                });
            }

            // --- 兑换码 ---
            let h3 = '';
            if (codes.length === 0) {
                h3 = '<div class="left-loading">暂无有效兑换码</div>';
            } else {
                codes.forEach(c => {
                    const exp = c.expireDate ? c.expireDate.slice(5) : '';
                    const gname = gameNameMap[c.gameId] || c.gameId;
                    h3 += `<div class="code-row">
                        <div>
                            <div class="code-gname">${gname}</div>
                            <div class="code-val">${c.code}</div>
                            <div class="code-reward">${c.reward || ''} · 至 ${exp}</div>
                        </div>
                        <button class="copy-btn" onclick="cp(this,'${c.code}')">复制</button>
                    </div>`;
                });
            }

            document.getElementById('left-body').innerHTML = `
                <div class="section on" id="ls-0">${h0}</div>
                <div class="section"     id="ls-1">${h1}</div>
                <div class="section"     id="ls-2">${h2}</div>
                <div class="section"     id="ls-3">${h3}</div>
            `;

            // 恢复当前激活的子 tab
            const activeStab = document.querySelector('.stab.on');
            if (activeStab) {
                const idx = [...document.querySelectorAll('.stab')].indexOf(activeStab);
                document.querySelectorAll('.section').forEach(s => s.classList.remove('on'));
                const target = document.getElementById('ls-' + idx);
                if (target) target.classList.add('on');
            }
        }

        function cp(btn, code) {
            navigator.clipboard.writeText(code).catch(() => {});
            btn.textContent = '已复制';
            setTimeout(() => btn.textContent = '复制', 1500);
        }

        // 注入 viewport meta 到同源 iframe，让内部 CSS @media 能匹配 iframe 实际宽度
        function injectViewport(iframe) {
            try {
                const doc = iframe.contentDocument;
                if (!doc) return;
                let meta = doc.querySelector('meta[name="viewport"]');
                if (!meta) {
                    meta = doc.createElement('meta');
                    meta.name = 'viewport';
                    doc.head.appendChild(meta);
                }
                meta.content = 'width=device-width, initial-scale=1';
                // 同时强制让根元素字号在窄屏放大点
                const w = iframe.clientWidth;
                if (w < 600) {
                    doc.documentElement.style.fontSize = '15px';
                } else {
                    doc.documentElement.style.fontSize = '';
                }
            } catch (e) { /* 跨域时静默失败 */ }
        }

        // 移动端：左右视图切换（仅 ≤900px 生效）
        function vs(which, el) {
            document.querySelectorAll('.vs-btn').forEach(b => b.classList.remove('on'));
            el.classList.add('on');
            const left  = document.getElementById('left-panel');
            const right = document.getElementById('right-panel');
            if (which === 'left') {
                left.classList.add('active');
                right.classList.remove('active');
            } else {
                right.classList.add('active');
                left.classList.remove('active');
            }
        }

        // ========== 初始化 ==========
        function init() {
            // 填充日期选择器（舆情日期）
            const sel = document.getElementById('date-select');
            sel.innerHTML = '';
            SENTIMENT_DATES.forEach((d, i) => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d + (i === 0 ? '（最新）' : '');
                sel.appendChild(opt);
            });

            // 加载右侧舆情
            loadSentiment(SENTIMENT_DATES[0]);
            // 加载左侧速报
            loadSpeedReport(SPEED_DATE);
        }

        init();
    </script>
</body>
</html>

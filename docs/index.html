<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二游舆情监控看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
        }

        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
            scroll-behavior: smooth;
        }

        .tab-btn {
            flex-shrink: 0;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: rgba(30, 41, 59, 0.6);
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #334155;
        }

        .tab-btn:hover {
            background: rgba(30, 144, 255, 0.15);
            border-color: #0ea5e9;
            color: #60a5fa;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #0ea5e9, #7c3aed);
            color: #ffffff;
            border-color: #0ea5e9;
        }

        .content-area {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            min-height: 600px;
            overflow: hidden;
        }

        .content-section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        iframe {
            width: 100%;
            height: 800px;
            border: none;
            border-radius: 8px;
            background: #0f172a;
        }

        .placeholder {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .placeholder h2 {
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .card:hover {
            background: rgba(30, 144, 255, 0.1);
            border-color: #0ea5e9;
            transform: translateX(4px);
        }

        .card-title {
            font-weight: 600;
            color: #60a5fa;
            margin-bottom: 4px;
        }

        .card-meta {
            font-size: 12px;
            color: #94a3b8;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
            padding-top: 20px;
            border-top: 1px solid #334155;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 28px;
            }

            .tabs-container {
                gap: 6px;
            }

            .tab-btn {
                padding: 10px 14px;
                font-size: 12px;
            }

            iframe {
                height: 600px;
            }

            .content-area {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 二游舆情监控看板</h1>
            <p class="subtitle">NGA / B站 / 贴吧 / 速报 - 每日实时监测</p>
        </header>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab(0, this)">📊 NGA吃瓜播报</button>
            <button class="tab-btn" onclick="switchTab(1, this)">🔴 B站直播日报</button>
            <button class="tab-btn" onclick="switchTab(2, this)">💬 B站游戏舆情</button>
            <button class="tab-btn" onclick="switchTab(3, this)">🎮 二次元重点游戏版更</button>
            <button class="tab-btn" onclick="switchTab(4, this)">📄 贴吧舆情日报</button>
        </div>

        <!-- 数据日期选择器 -->
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
            <span style="color:#94a3b8; font-size:13px;">📅 数据日期：</span>
            <select id="date-select" onchange="onDateChange()" style="background:#1e293b; color:#e2e8f0; border:1px solid #334155; border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer;">
                <option value="">加载中...</option>
            </select>
            <span id="update-time" style="color:#64748b; font-size:12px;"></span>
        </div>

        <div class="content-area">
            <div class="content-section active" id="section-0">
                <iframe id="iframe-0" src="about:blank"></iframe>
            </div>
            <div class="content-section" id="section-1">
                <iframe id="iframe-1" src="about:blank"></iframe>
            </div>
            <div class="content-section" id="section-2">
                <iframe id="iframe-2" src="about:blank"></iframe>
            </div>
            <div class="content-section" id="section-3">
                <iframe id="iframe-3" src="about:blank"></iframe>
            </div>
            <div class="content-section" id="section-4">
                <iframe id="iframe-4" src="about:blank"></iframe>
            </div>
        </div>

        <div class="footer">
            <p>💾 所有报告每日自动生成并更新 | 数据来源：NGA / B站直播 / B站游戏 / 贴吧</p>
        </div>
    </div>

    <script>
        // 来源 ID → tab index 映射
        const SOURCE_TABS = {
            'nga':           0,
            'bilibili_live': 1,
            'bilibili_game': 2,
            'game_speed':    3,
            'tieba':         4,
        };

        // 来源 ID → docs 子文件夹名
        const SOURCE_DIRS = {
            'nga':           'nga',
            'bilibili_live': 'bilibili_live',
            'bilibili_game': 'bilibili_game',
            'game_speed':    'game_speed',
            'tieba':         'tieba',
        };

        let currentDate = '';
        let summaryData = null;

        // 已知日期列表（从最新到最旧），可由推送脚本自动追加
        const KNOWN_DATES = [
            '2026-06-03',
            '2026-06-02',
        ];

        async function init() {
            // 填充日期选择器
            const sel = document.getElementById('date-select');
            sel.innerHTML = '';
            KNOWN_DATES.forEach((d, i) => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d + (i === 0 ? '（最新）' : '');
                sel.appendChild(opt);
            });

            // 加载最新日期的数据
            await loadDate(KNOWN_DATES[0]);
        }

        async function loadDate(date) {
            currentDate = date;
            document.getElementById('update-time').textContent = '加载中...';

            try {
                const res = await fetch(`summary/${date}.json?t=${Date.now()}`);
                summaryData = await res.json();

                // 更新所有 iframe 路径
                summaryData.tasks.forEach(task => {
                    const tabIdx = SOURCE_TABS[task.id];
                    if (tabIdx !== undefined) {
                        const dir = SOURCE_DIRS[task.id];
                        const url = `${dir}/${date}/report.html`;
                        document.getElementById(`iframe-${tabIdx}`).src = url;
                    }
                });

                const updatedAt = summaryData.updated_at
                    ? new Date(summaryData.updated_at).toLocaleString('zh-CN')
                    : '';
                document.getElementById('update-time').textContent = `更新于 ${updatedAt}`;
            } catch (e) {
                document.getElementById('update-time').textContent = `加载失败: ${e.message}`;
            }
        }

        function onDateChange() {
            const date = document.getElementById('date-select').value;
            if (date) loadDate(date);
        }

        function switchTab(index, element) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`section-${index}`).classList.add('active');
            element.classList.add('active');
            element.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
        }

        init();
    </script>
</body>
</html>
